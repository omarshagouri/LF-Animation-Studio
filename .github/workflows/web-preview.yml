name: Deploy browser previews

on:
  push:
    branches: [feat/ios-app-foundation, feat/studio-five-modules]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omar-studio-browser-preview
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: '1'
    outputs:
      foundation_revision: ${{ steps.foundation.outputs.revision }}
      candidate_revision: ${{ steps.candidate.outputs.revision }}

    steps:
      - name: Check out the foundation
        uses: actions/checkout@v6
        with:
          ref: refs/heads/feat/ios-app-foundation
          path: foundation
          persist-credentials: false
      - name: Check out the five-module candidate
        uses: actions/checkout@v6
        with:
          ref: refs/heads/feat/studio-five-modules
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: foundation/.nvmrc
          cache: npm
          cache-dependency-path: |
            foundation/package-lock.json
            candidate/package-lock.json
      - name: Resolve Pages path
        id: pages
        uses: actions/configure-pages@v5
      - name: Explain how to enable Pages
        if: failure() && steps.pages.outcome == 'failure'
        run: echo "::error::Select GitHub Actions under Settings → Pages, and permit both development branches in the github-pages environment."
      - name: Export the foundation
        id: foundation
        working-directory: foundation
        env:
          OMAR_WEB_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run build:web
          test -s dist/web/index.html
          revision=$(git rev-parse HEAD)
          printf '%s\n' "$revision" > dist/web/revision.txt
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Verify and export the five-module candidate
        id: candidate
        working-directory: candidate
        env:
          PAGES_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          node --test backend/*.test.mjs
          OMAR_WEB_BASE_PATH='' npm run build:web
          npx playwright install --with-deps chromium
          npm run test:browser
          OMAR_WEB_BASE_PATH="${PAGES_PATH%/}/preview" npm run build:web
          test -s dist/web/index.html
          revision=$(git rev-parse HEAD)
          printf '%s\n' "$revision" > dist/web/revision.txt
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Publish both exports in one artifact
        run: |
          test ! -e foundation/dist/web/preview
          mv candidate/dist/web foundation/dist/web/preview
      - uses: actions/upload-pages-artifact@v4
        with:
          path: foundation/dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify both public URLs and revisions
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          FOUNDATION_REVISION: ${{ needs.build.outputs.foundation_revision }}
          CANDIDATE_REVISION: ${{ needs.build.outputs.candidate_revision }}
        run: |
          origin=$(printf '%s' "$PAGE_URL" | cut -d / -f 1-3)

          verify() {
            local url="$1" expected="$2" revision='' script=''
            for attempt in {1..12}; do
              revision=$(curl -fsSL --max-time 10 "${url}revision.txt?commit=$expected" || true)
              if [ "$revision" = "$expected" ]; then
                break
              fi
              sleep 5
            done
            test "$revision" = "$expected"
            curl -fsSL --max-time 20 "$url" --output "$RUNNER_TEMP/preview.html"
            script=$(grep -oE 'src="[^"]*/_expo/static/js/web/[^"]+\.js"' "$RUNNER_TEMP/preview.html" | head -1 | cut -d '"' -f2)
            test -n "$script"
            curl -fsSL --max-time 20 "$origin$script" --output "$RUNNER_TEMP/preview.js"
            test -s "$RUNNER_TEMP/preview.js"
          }

          root="${PAGE_URL%/}/"
          verify "$root" "$FOUNDATION_REVISION"
          verify "${root}preview/" "$CANDIDATE_REVISION"
          printf '[Foundation release](%s)\n[Five-module preview](%spreview/)\n' "$root" "$root" >> "$GITHUB_STEP_SUMMARY"
