name: Deploy browser preview

on:
  push:
    branches: [feat/ios-app-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omar-studio-browser-preview
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_NO_TELEMETRY: '1'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Resolve Pages path
        id: pages
        uses: actions/configure-pages@v5
      - name: Explain how to enable Pages
        if: failure() && steps.pages.outcome == 'failure'
        run: echo "::error::Select GitHub Actions under Settings → Pages → Build and deployment → Source, then rerun this workflow."
      - name: Export Expo preview
        env:
          OMAR_WEB_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm run build:web
          test -s dist/web/index.html
          printf '%s\n' "$GITHUB_SHA" > dist/web/revision.txt
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public preview
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            revision=$(curl -fsSL --max-time 10 "${PAGE_URL%/}/revision.txt?commit=$GITHUB_SHA" || true)
            if [ "$revision" = "$GITHUB_SHA" ]; then
              break
            fi
            sleep 5
          done
          test "$revision" = "$GITHUB_SHA"
          curl -fsSL --max-time 20 "${PAGE_URL%/}/" --output "$RUNNER_TEMP/preview.html"
          script=$(grep -oE 'src="[^"]*/_expo/static/js/web/[^"]+\.js"' "$RUNNER_TEMP/preview.html" | head -1 | cut -d '"' -f2)
          test -n "$script"
          origin=$(printf '%s' "$PAGE_URL" | cut -d / -f 1-3)
          curl -fsSL --max-time 20 "$origin$script" --output "$RUNNER_TEMP/preview.js"
          test -s "$RUNNER_TEMP/preview.js"
          printf '[Public browser preview](%s)\n' "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
